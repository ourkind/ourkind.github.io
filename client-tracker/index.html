<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#15191b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Relationships, recruiting and customer care stored on your device."
    />
    <title>Client Tracker | Raeford</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="drafts.js"></script>
    <script defer src="tutor.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header>
      <div>
        <span class="brand">RAEFORD AI SOLUTION DESIGN</span>
        <h1>Client Tracker</h1>
      </div>
      <div class="header-actions">
        <span id="save-status" role="status">Device workspace</span
        ><button id="install" hidden>Install app</button>
      </div>
    </header>
    <nav aria-label="Workspace" id="nav"></nav>
    <main id="main"></main>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="tour">
      <h2 id="tour-title"></h2>
      <p id="tour-body"></p>
      <p id="tour-position"></p>
      <div class="actions">
        <button id="tour-close">Close tour</button
        ><button id="tour-next" class="primary">Next</button>
      </div>
    </dialog>
    <footer>
      Stored in this browser on this device. Export a CSV backup before changing
      devices or clearing browser data.
    </footer>
  </body>
</html>
